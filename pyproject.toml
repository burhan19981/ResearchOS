[project]
name = "researchos"
version = "0.0.1"
description = "Experimental local research workflow platform with evidence, approvals, experiment provenance, and a dashboard."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.6,<2.0",
    "openai>=3.14,<4.0",
    "python-dotenv>=1.2,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.20,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10.0",
]
dashboard = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
