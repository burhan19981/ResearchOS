[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os

# The real URL is supplied at runtime by migrations/env.py (via
# researchos.db.config.load_database_config) so credentials/paths are
# never hard-coded here. This placeholder is only used if Alembic is
# invoked in a context where env.py's override somehow does not run.
sqlalchemy.url = sqlite:///data/researchos.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
